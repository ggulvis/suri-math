<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7c5cff">
<title>수리수리 🦉</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f3eeff; --card:#ffffff; --ink:#3a3160; --sub:#8a80b8;
  --accent:#7c5cff; --accent2:#ffb347; --good:#4ecb71; --bad:#ff6b81;
  --radius:24px; --shadow:0 6px 0 rgba(90,70,180,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%}
body{
  font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif;
  background:var(--bg); color:var(--ink); overflow:hidden;
  display:flex; flex-direction:column;
}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.screen.on{display:flex}
.bigbtn{
  border:none;border-radius:var(--radius);background:var(--accent);color:#fff;
  font-size:24px;font-weight:800;padding:18px 44px;box-shadow:0 8px 0 #5a3fd6;
  font-family:inherit;cursor:pointer;transition:transform .08s;
}
.bigbtn:active{transform:translateY(6px);box-shadow:0 2px 0 #5a3fd6}

/* ---------- HOME (펫 홈) ---------- */
#home{align-items:center;justify-content:center;gap:14px;text-align:center}
#parentBtn{position:absolute;top:max(12px,env(safe-area-inset-top));right:14px;background:none;border:none;font-size:13px;color:var(--sub);padding:10px;font-family:inherit}
#homeStarsBox{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;font-weight:800;font-size:18px;padding:10px}
.petscene{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:22px 30px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:min(80vw,340px);
}
#petFace{font-size:min(26vw,110px);animation:bob 2.4s ease-in-out infinite;cursor:pointer;position:relative;line-height:1}
#petFace img{width:min(30vw,130px);height:min(30vw,130px);object-fit:contain;display:block}
#petFace.sad{filter:grayscale(.6);animation:none}
#petFx{position:absolute;top:-8px;right:-16px;font-size:26px;pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.anim-happy{animation:happyJump .6s ease 2 !important}
@keyframes happyJump{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-18px) scale(1.15)}}
.anim-sad{animation:none !important;transform:rotate(-6deg)}
.anim-angry{animation:shake .4s ease 2 !important}
.anim-sleepy{animation:bob 4s ease-in-out infinite !important;filter:saturate(.7)}
@keyframes fxFloat{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-24px)}}
#petFx.go{animation:fxFloat 1.6s ease forwards}
#petName{font-size:22px;font-weight:800}
#petHearts{font-size:18px;letter-spacing:2px}
#petMsg{font-size:15px;color:var(--sub);font-weight:600;min-height:20px}
#feedBtn{
  border:none;border-radius:16px;background:var(--accent2);color:#6b4400;
  font-size:17px;font-weight:800;padding:12px 22px;box-shadow:0 5px 0 #d9922e;font-family:inherit;cursor:pointer;
}
#feedBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #d9922e}
#feedBtn:disabled{opacity:.45}
.eggrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:90vw}
.eggslot{
  background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  width:60px;height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:28px;cursor:pointer;position:relative;
}
.eggslot .lbl{font-size:10px;color:var(--sub);font-weight:700}
.eggslot.locked{opacity:.45;filter:grayscale(1)}
.eggslot.active{outline:3px solid var(--accent)}

/* ---------- GAME ---------- */
#game{gap:10px}
.topbar{display:flex;align-items:center;gap:10px}
.progress{flex:1;height:16px;background:#e2daff;border-radius:99px;overflow:hidden}
.progress>div{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#a58bff);border-radius:99px;transition:width .4s}
.starcount{font-weight:800;font-size:18px}
#gamePet{font-size:26px;transition:transform .2s}
#gamePet.jump{transform:translateY(-10px) scale(1.25)}
#quitBtn{background:none;border:none;font-size:22px;color:var(--sub);font-family:inherit;padding:4px 8px}
.qcard{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;gap:12px;min-height:0;position:relative;
}
#speakBtn{position:absolute;top:12px;right:12px;border:none;background:#f0eaff;border-radius:99px;width:52px;height:52px;font-size:26px;cursor:pointer}
#qtext{font-size:clamp(17px,4.5vw,24px);font-weight:700;text-align:center;line-height:1.5;max-width:560px}
.objzone{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:6px;max-width:560px;min-height:50px}
.objzone .obj{font-size:clamp(28px,7vw,42px);position:relative;transition:transform .1s}
.objzone .obj.gone{opacity:.25;filter:grayscale(1)}
.objzone .obj .cnt{
  position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;
  font-size:13px;font-weight:800;border-radius:99px;min-width:20px;height:20px;
  display:none;align-items:center;justify-content:center;padding:0 4px;
}
.objzone .obj.counted .cnt{display:flex}
.objzone .obj.counted{transform:scale(1.15)}
.grp{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;background:#faf7ff;border:3px solid #e2daff;border-radius:18px;padding:12px;cursor:pointer;max-width:46%}
.grp .obj{font-size:clamp(26px,6vw,36px)}
.vs{display:flex;gap:10px;align-items:stretch;justify-content:center;width:100%}
.opline{font-size:clamp(24px,6vw,36px);font-weight:800;letter-spacing:2px}
#hint{font-size:16px;color:var(--sub);text-align:center;min-height:22px;font-weight:700}

.choices{display:flex;gap:12px;justify-content:center;padding:4px 0}
.choice{
  border:none;border-radius:20px;background:#fff;color:var(--ink);
  font-size:32px;font-weight:800;width:min(28vw,110px);height:min(20vw,84px);
  box-shadow:0 6px 0 #d9d0f5;font-family:inherit;cursor:pointer;transition:transform .08s;
}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 #d9d0f5}
.choice.correct{background:var(--good);color:#fff;box-shadow:0 6px 0 #2f9e52}
.choice.wrong{background:var(--bad);color:#fff;box-shadow:0 6px 0 #d64a5f;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- 손글씨 ---------- */
#writezone{display:none;flex-direction:column;gap:8px;align-items:center;padding:4px 0}
#padWrap{background:#fff;border-radius:18px;box-shadow:0 6px 0 #d9d0f5;padding:6px;position:relative}
#pad{touch-action:none;border-radius:14px;background:repeating-linear-gradient(90deg,#fdfcff 0 2px,transparent 2px 100%),#fdfcff;display:block}
#padGuide{position:absolute;inset:6px;pointer-events:none;color:#d9d0f5;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.padbtns{display:flex;gap:10px}
.padbtn{border:none;border-radius:14px;font-family:inherit;font-size:17px;font-weight:800;padding:12px 20px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.12)}
#clearBtn{background:#efe9ff;color:var(--sub)}
#submitInk{background:var(--good);color:#fff;box-shadow:0 5px 0 #2f9e52}
#confirmBox{
  display:none;position:absolute;inset:0;background:rgba(255,255,255,.96);border-radius:var(--radius);
  flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5;
}
#confirmNum{font-size:72px;font-weight:800;color:var(--accent)}
#confirmQ{font-size:19px;font-weight:700}
.cbtns{display:flex;gap:14px}

/* ---------- CELEBRATE ---------- */
#done{align-items:center;justify-content:center;gap:16px;text-align:center}
#done .owl{font-size:96px}
#done h2{font-size:28px}
#doneStars{font-size:24px;letter-spacing:4px}
.eventcard{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 22px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.eventcard .big{font-size:40px}
.confetti{position:absolute;top:-20px;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- PARENT ---------- */
#parent{overflow-y:auto;gap:14px}
#parent header{display:flex;align-items:center;justify-content:space-between}
#parent h2{font-size:22px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.card h3{font-size:15px;color:var(--sub);margin-bottom:10px}
.insight{font-size:16px;line-height:1.6;font-weight:600}
.insight+.insight{margin-top:10px;padding-top:10px;border-top:1px dashed #e2daff}
.skillrow{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:14px}
.skillrow .nm{width:110px;font-weight:700}
.skillrow .bar{flex:1;height:12px;background:#efe9ff;border-radius:99px;overflow:hidden}
.skillrow .bar>div{height:100%;background:var(--good);border-radius:99px}
.skillrow .pct{width:74px;text-align:right;color:var(--sub);font-weight:700}
.setrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:15px;font-weight:600;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:#efe9ff;border-radius:12px;padding:3px}
.seg button{border:none;background:none;font-family:inherit;font-size:14px;font-weight:700;padding:7px 12px;border-radius:10px;color:var(--sub)}
.seg button.on{background:var(--accent);color:#fff}
.linkbtn{border:none;background:none;color:var(--bad);font-family:inherit;font-size:14px;font-weight:700;padding:8px 0}
.txtinput{border:2px solid #e2daff;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;padding:8px 12px;width:110px;color:var(--ink);background:#faf7ff;-webkit-user-select:text;user-select:text}
#backBtn{background:none;border:none;font-size:16px;color:var(--accent);font-weight:800;font-family:inherit;padding:8px}
.empty{color:var(--sub);font-size:14px}
</style>
</head>
<body>

<!-- HOME = 펫 홈 -->
<div class="screen on" id="home">
  <div id="homeStarsBox">⭐ <span id="homeStars">0</span></div>
  <button id="parentBtn">부모님</button>
  <div class="petscene">
    <div id="petFace">🥚<span id="petFx"></span></div>
    <div id="petName">?</div>
    <div id="petHearts"></div>
    <div id="petMsg"></div>
    <button id="feedBtn">🍖 밥 주기 (⭐2)</button>
  </div>
  <div class="eggrow" id="eggrow"></div>
  <button class="bigbtn" id="startBtn">모험 시작!</button>
</div>

<!-- GAME -->
<div class="screen" id="game">
  <div class="topbar">
    <button id="quitBtn">✕</button>
    <div class="progress"><div id="pbar"></div></div>
    <span id="gamePet">🦉</span>
    <div class="starcount">⭐<span id="gStars">0</span></div>
  </div>
  <div class="qcard">
    <button id="speakBtn">🔊</button>
    <div id="qtext"></div>
    <div id="stage"></div>
    <div id="hint"></div>
    <div id="confirmBox">
      <div id="confirmNum"></div>
      <div id="confirmQ">이렇게 썼어?</div>
      <div class="cbtns">
        <button class="padbtn" id="cYes" style="background:var(--good);color:#fff">응, 맞아!</button>
        <button class="padbtn" id="cNo" style="background:#efe9ff;color:var(--sub)">다시 쓸래</button>
      </div>
    </div>
  </div>
  <div class="choices" id="choices"></div>
  <div id="writezone">
    <div id="padWrap">
      <canvas id="pad"></canvas>
      <div id="padGuide">여기에 숫자를 써 보세요 ✏️</div>
    </div>
    <div class="padbtns">
      <button class="padbtn" id="clearBtn">🗑 지우기</button>
      <button class="padbtn" id="submitInk">✅ 다 썼어요</button>
    </div>
  </div>
</div>

<!-- DONE -->
<div class="screen" id="done">
  <div class="owl" id="doneFace">🦉🎉</div>
  <h2>오늘의 모험 완료!</h2>
  <div id="doneStars"></div>
  <div id="doneEvents" style="display:flex;flex-direction:column;gap:10px"></div>
  <div id="doneMsg" style="color:var(--sub);font-size:17px;font-weight:600"></div>
  <button class="bigbtn" id="homeBtn">집으로</button>
</div>

<!-- PARENT -->
<div class="screen" id="parent">
  <header>
    <h2>👨‍👩‍👧 부모님 리포트</h2>
    <button id="backBtn">닫기 ✕</button>
  </header>
  <div class="card">
    <h3>오늘의 한 문장</h3>
    <div id="insights"></div>
  </div>
  <div class="card">
    <h3>영역별 정답률 (최근 20문제)</h3>
    <div id="skillbars"></div>
  </div>
  <div class="card">
    <h3>설정</h3>
    <div class="setrow"><span>숫자 범위</span>
      <div class="seg" id="segRange"><button data-v="5">5까지</button><button data-v="10">10까지</button><button data-v="20">20까지</button></div>
    </div>
    <div class="setrow"><span>한 판 문제 수</span>
      <div class="seg" id="segLen"><button data-v="5">5</button><button data-v="10">10</button><button data-v="15">15</button></div>
    </div>
    <div class="setrow"><span>문제 언어</span>
      <div class="seg" id="segLang"><button data-v="ko">한국어</button><button data-v="en">English</button><button data-v="mix">번갈아</button></div>
    </div>
    <div class="setrow"><span>답 입력 방식</span>
      <div class="seg" id="segInput"><button data-v="tap">보기 누르기</button><button data-v="write">손글씨 ✏️</button></div>
    </div>
    <div class="setrow"><span>문제 읽어주기</span>
      <div class="seg" id="segTts"><button data-v="1">켜기</button><button data-v="0">끄기</button></div>
    </div>
    <div class="setrow"><span>아이 이름 (펫이 불러줘요)</span>
      <input type="text" id="childNameInput" class="txtinput" maxlength="6" placeholder="예: 지우">
    </div>
    <button class="linkbtn" id="resetBtn">기록 전체 삭제</button>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   수리수리 v0.2 — 7세(만5~6) 수학 앱
   1) 전 문제 TTS 낭독(한/영) + 이모지 시각화
   2) 진단: 보기 모드=오개념 함정 선택지 / 손글씨 모드=자유 오답 분류
   3) 오답 → 세기 스캐폴드 → 재도전, 두 번째 오답 → 정답 공개
   4) 취약 오개념 겨냥 재출제(remediation 큐)
   5) 펫: 부화·진화=정답 수, 먹이=별, 새로운 알=스킬 마스터 (학습이 유일한 연료)
   6) 손글씨: $P 포인트클라우드 인식 + "맞아?" 확인 루프 (오인식≠오답)
   ===================================================================== */

const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- 저장소 ---------- */
const KEY = "suri.v1";
const defaultState = () => ({
  stars: 0,
  settings: { max: 10, len: 10, tts: 1, lang: "ko", input: "tap", childName: "" },
  skills: {}, miscon: {}, remediation: [], log: [],
  pet: null, // migratePet()에서 초기화
});
let S;
try { S = Object.assign(defaultState(), JSON.parse(localStorage.getItem(KEY) || "{}")); }
catch (e) { S = defaultState(); }
S.settings = Object.assign(defaultState().settings, S.settings);
const save = () => localStorage.setItem(KEY, JSON.stringify(S));

/* ---------- TTS ---------- */
let koVoice = null, enVoice = null;
function loadVoices() {
  const vs = speechSynthesis.getVoices();
  koVoice = vs.find(v => v.lang.startsWith("ko") && v.name.includes("Yuna")) || vs.find(v => v.lang.startsWith("ko")) || null;
  enVoice = vs.find(v => v.lang.startsWith("en") && /Samantha|Karen|Daniel/.test(v.name)) || vs.find(v => v.lang.startsWith("en")) || null;
}
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, lang = "ko") {
  if (!S.settings.tts || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = lang === "en" ? enVoice : koVoice;
  if (v) u.voice = v;
  u.lang = lang === "en" ? "en-US" : "ko-KR";
  u.rate = lang === "en" ? 0.85 : 0.85; u.pitch = 1.1;
  speechSynthesis.speak(u);
}

/* ---------- 효과음 ---------- */
let AC = null;
function tone(freq, dur, type, when = 0, gain = 0.15) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, AC.currentTime + when);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + when + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(AC.currentTime + when); o.stop(AC.currentTime + when + dur);
  } catch (e) {}
}
const sfxGood = () => { tone(660, .12, "sine"); tone(880, .18, "sine", .1); tone(1320, .25, "sine", .2); };
const sfxBad = () => tone(180, .3, "sawtooth", 0, 0.08);
const sfxTap = () => tone(520, .06, "sine", 0, 0.1);

/* ---------- 스킬·물건 ---------- */
const SKILLS = {
  S1: { name: "수 세기", emoji: "🔢" }, S2: { name: "더하기", emoji: "➕" },
  S3: { name: "빼기", emoji: "➖" }, S4: { name: "비교하기", emoji: "⚖️" },
  S5: { name: "이야기 문제", emoji: "📖" },
};
const ORDER = ["S1", "S2", "S3", "S4", "S5"];
const OBJECTS = [
  { e: "🍎", n: "사과", en: "apple", enPl: "apples" }, { e: "🍬", n: "사탕", en: "candy", enPl: "candies" },
  { e: "🍓", n: "딸기", en: "strawberry", enPl: "strawberries" }, { e: "🍪", n: "쿠키", en: "cookie", enPl: "cookies" },
  { e: "🎈", n: "풍선", en: "balloon", enPl: "balloons" }, { e: "🥚", n: "공룡알", en: "dino egg", enPl: "dino eggs" },
  { e: "🚗", n: "자동차", en: "car", enPl: "cars" }, { e: "🌟", n: "별", en: "star", enPl: "stars" },
];
const ANIMALS = [
  { e: "🐟", n: "물고기", en: "fish", enPl: "fish" }, { e: "🐦", n: "새", en: "bird", enPl: "birds" },
  { e: "🐶", n: "강아지", en: "puppy", enPl: "puppies" }, { e: "🐱", n: "고양이", en: "cat", enPl: "cats" },
];
const FLYERS = [{ e: "🐦", n: "새", en: "bird", enPl: "birds" }, { e: "🦋", n: "나비", en: "butterfly", enPl: "butterflies" }];
const NAMES = ["수리", "토토", "라라", "코코"];
const NAMES_EN = ["Suri", "Toto", "Lala", "Koko"];
const NUM_EN = ["zero","one","two","three","four","five","six","seven","eight","nine","ten",
  "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];

/* ---------- 펫 시스템 ----------
   학습이 유일한 연료: 부화 5정답, 진화 25정답, 먹이=별, 새 알=스킬 마스터 */

const ART = {};

  for (const st of ART_STATES) {
    const k = `${id}_${st}`;
    if (ART[k] !== undefined) continue;
    ART[k] = null;
    const im = new Image();
    im.onload = () => { ART[k] = im.src; if ($("#home").classList.contains("on")) renderHome(); };
    im.src = `assets/${k}.png`;
  }

  if (h >= 21 || h < 7) return "sleepy";
  return "idle";
}
function petFaceHTML(id, state) {
  const p = S.pet.pets[id];
  const st = p.stage === 0 ? "egg" : state;
  const art = ART[`${id}_${st}`] || (st !== "idle" && p.stage > 0 ? ART[`${id}_idle`] : null);

const hasJongName = w => { const c = w.charCodeAt(w.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 > 0; };

  const per = PERSONA[S.pet.active] || PERSONA.owl;
  const pool = per[kind] && per[kind].length ? per[kind] : per.greet;
  S.pet.lineIdx = ((S.pet.lineIdx || 0) + 1) % 997;
  const nm = S.settings.childName;
  const bare = nm ? nm + (hasJongName(nm) ? "이" : "") : "친구";  // 조사 앞: 하준이/지우
  return pool[S.pet.lineIdx % pool.length]

    .replace(/\{child\}(?=[,!?.…~]|$)/g, voc(nm))      // 부르는 위치 → 호격

  face.classList.remove("anim-happy", "anim-sad", "anim-angry", "anim-sleepy");
  if (state === "happy") face.classList.add("anim-happy");
  if (state === "sad") face.classList.add("anim-sad");
  if (state === "angry") face.classList.add("anim-angry");
  if (state === "sleepy") face.classList.add("anim-sleepy");
  const fx = $("#petFx");
  if (fx) {
    fx.textContent = FX[state] || "";
    fx.classList.remove("go");
    if (FX[state]) { void fx.offsetWidth; fx.classList.add("go"); }
  }
  setTimeout(() => face.classList.remove("anim-happy", "anim-angry"), 1400);
}

const HATCH_XP = 5, EVOLVE_XP = 25;

  // 하트 시간 감쇠
  const el = (Date.now() - S.pet.ts) / 36e5;
  const dec = Math.floor(el / HEART_DECAY_H);
  if (dec > 0) { S.pet.hearts = Math.max(0, S.pet.hearts - dec); S.pet.ts = Date.now(); }

/* ---------- 보기(선택지) 생성 ---------- */
function makeChoices(answer, wrongs) {
  const seen = new Set([answer]);
  const out = [{ v: answer, tag: null }];
  for (const w of wrongs) {
    if (w.v >= 0 && !seen.has(w.v)) { seen.add(w.v); out.push(w); }
    if (out.length === 3) break;
  }
  let fill = answer + 3;
  while (out.length < 3) {
    if (!seen.has(fill) && fill >= 0) { seen.add(fill); out.push({ v: fill, tag: "other" }); }
    fill = fill >= 0 ? fill + 1 : 1;
  }
  return shuffle(out);
}

    objs: [{ e: o.e, n }], answer: n,
    choices: makeChoices(n, shuffle([{ v: n - 1, tag: "offByOne" }, { v: n + 1, tag: "offByOne" }, { v: n + 2, tag: "other" }])),

    objs: [{ e: o.e, n: a }, { e: o.e, n: b, sep: true }], answer: a + b,
    choices: makeChoices(a + b, shuffle([{ v: a + b - 1, tag: "offByOne" }, { v: a + b + 1, tag: "offByOne" }, { v: Math.abs(a - b), tag: "opConfusion" }])),

/* ---------- 오답 분류 (손글씨 자유답용) ---------- */

  const wasMastered = ORDER.map(mastered);
  st.recent.push(correct && firstTry ? 1 : 0);
  if (st.recent.length > 20) st.recent.shift();
  S.skills[q.skill] = st;
  if (!correct || !firstTry) {

    S.miscon[tag] = (S.miscon[tag] || 0) + 1;
    S.remediation.push(q.skill);
    if (tag === "opConfusion") S.remediation.push(q.op === "add" ? "S3" : "S2");
    if (tag === "offByOne") S.remediation.push("S1");
    if (S.remediation.length > 4) S.remediation = S.remediation.slice(-4);
  }
  if (correct && firstTry) petGainXp(session.events);

  const nowMastered = ORDER.map(mastered);

const PP_N = 32;

    if (D + d >= I) {
      const t = (I - D) / d;
      const nx = pts[i-1].x + t * (pts[i].x - pts[i-1].x);

      pts.splice(i, 0, { x: nx, y: ny });

    s.textContent = pick(em);
    s.style.left = rnd(100) + "vw";
    s.style.animationDuration = (2 + Math.random() * 2) + "s";
    s.style.animationDelay = (Math.random() * 1.2) + "s";
    $("#done").appendChild(s);
    setTimeout(() => s.remove(), 5000);
  }
}

/* ---------- 부모 리포트 ---------- */
const MISCON_TEXT = {
  offByOne: {
    t: "정답에서 1만큼 차이 나게 답하는 경우가 잦아요. 아직 손가락·물건을 하나씩 짚으며 세는 단계라 자연스러운 실수예요.",
    tip: "오늘 저녁, 과자 6개를 놓고 \"하나, 둘…\" 같이 세어 본 뒤 2개 먹고 \"몇 개 남았지?\" 물어봐 주세요.",
  },
  opConfusion: {
    t: "빼기 문제를 더하기로(또는 반대로) 계산하는 모습이 보여요. '더하면 늘어나고 빼면 줄어든다'는 방향 감각을 잡는 중이에요.",
    tip: "물건으로 직접 보여주세요 — 사탕 5개에서 2개를 진짜로 치우면서 \"줄었네! 빼기야\"라고 말해 주세요.",
  },
  reversal: {
    t: "두 자리 수를 뒤집어 쓰는 경우가 있어요(12를 21로). 자릿수 개념이 자라는 중이라는 신호예요.",
    tip: "\"십의 자리 먼저!\"를 노래처럼 — 열 개 묶음과 낱개를 물건으로 묶어 보여 주세요.",
  },
  story: {
    t: "계산 자체보다 이야기를 듣고 상황을 파악하는 걸 어려워해요. 듣기 집중력과 언어 이해가 크는 중이에요.",
    tip: "문제를 다시 들려주고 \"무슨 일이 일어났어?\"를 먼저 물어봐 주세요. 답보다 상황 설명이 먼저예요.",
  },
  compare: {
    t: "많고 적음 비교에서 헷갈려해요. 개수가 아니라 크기·퍼진 정도로 판단하는 시기일 수 있어요.",
    tip: "줄 맞춰 나란히 놓고 비교하게 해 주세요 — 하나씩 짝지어 보면 금방 알아차려요.",
  },
  other: { t: "", tip: "" },
};
function renderParent() {
  const recent = S.log.slice(-30);
  const counts = {};
  recent.forEach(l => { if (l.tag && !l.correct) counts[l.tag] = (counts[l.tag] || 0) + 1; });
  const sorted = Object.entries(counts).filter(([k]) => MISCON_TEXT[k] && MISCON_TEXT[k].t).sort((a, b) => b[1] - a[1]);
  const box = $("#insights");
  box.innerHTML = "";
  if (!recent.length) {
    box.innerHTML = `<div class="empty">아직 기록이 없어요. 아이와 첫 모험을 시작해 보세요!</div>`;
  } else if (!sorted.length) {
    const acc = Math.round(recent.reduce((a, l) => a + l.correct, 0) / recent.length * 100);
    box.innerHTML = `<div class="insight">👍 최근 정답률 ${acc}% — 특별한 취약 패턴 없이 잘하고 있어요.${acc >= 85 ? " 설정에서 숫자 범위를 넓혀 볼 때예요!" : ""}</div>`;
  } else {
    sorted.slice(0, 2).forEach(([k]) => {
      const m = MISCON_TEXT[k];
      box.innerHTML += `<div class="insight">🔍 ${m.t}<br><br>💬 <b>${m.tip}</b></div>`;
    });
  }
  const sb = $("#skillbars");
  sb.innerHTML = "";
  ORDER.forEach(k => {
    const st = skillStat(k);
    const r = st.recent;
    if (!r.length) {
      sb.innerHTML += `<div class="skillrow"><span class="nm">${SKILLS[k].emoji} ${SKILLS[k].name}</span><div class="bar"><div style="width:0"></div></div><span class="pct">아직 전</span></div>`;
      return;
    }
    const acc = Math.round(r.reduce((a, b) => a + b, 0) / r.length * 100);
    sb.innerHTML += `<div class="skillrow"><span class="nm">${SKILLS[k].emoji} ${SKILLS[k].name}</span><div class="bar"><div style="width:${acc}%"></div></div><span class="pct">${acc}% (${r.length})</span></div>`;
  });
  syncSeg("#segRange", S.settings.max);
  syncSeg("#segLen", S.settings.len);
  syncSeg("#segLang", S.settings.lang);
  syncSeg("#segInput", S.settings.input);
  syncSeg("#segTts", S.settings.tts);
  $("#childNameInput").value = S.settings.childName || "";
}
function syncSeg(sel, val) {
  document.querySelectorAll(sel + " button").forEach(b => b.classList.toggle("on", String(b.dataset.v) === String(val)));
}
const segBind = (sel, key, numeric) => {
  $(sel).onclick = e => {
    if (!e.target.dataset.v) return;
    S.settings[key] = numeric ? +e.target.dataset.v : e.target.dataset.v;
    save(); syncSeg(sel, S.settings[key]);
  };
};
segBind("#segRange", "max", true);
segBind("#segLen", "len", true);
segBind("#segLang", "lang", false);
segBind("#segInput", "input", false);
segBind("#segTts", "tts", true);
$("#childNameInput").addEventListener("input", e => { S.settings.childName = e.target.value.trim(); save(); });
$("#resetBtn").onclick = () => {
  if (confirm("모든 학습 기록과 별, 펫을 삭제할까요?")) {
    S = defaultState(); migratePet(); save();
    renderParent(); renderHome();
  }
};

/* ---------- 화면 전환 ---------- */
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $("#" + id).classList.add("on");
  if (id === "home") renderHome();
}
$("#startBtn").onclick = () => { tone(660, .1, "sine"); startSession(); };
$("#quitBtn").onclick = () => { speechSynthesis.cancel && speechSynthesis.cancel(); showScreen("home"); };
$("#homeBtn").onclick = () => showScreen("home");
$("#speakBtn").onclick = () => session && speak(session.q.speakText, session.q.lang);
$("#backBtn").onclick = () => showScreen("home");

/* 부모 버튼: 2초 길게 누르기 */
let pTimer = null;
const pBtn = $("#parentBtn");
["touchstart", "mousedown"].forEach(ev => pBtn.addEventListener(ev, e => {
  e.preventDefault();
  pBtn.textContent = "꾹 누르는 중…";
  pTimer = setTimeout(() => { pBtn.textContent = "부모님"; renderParent(); showScreen("parent"); }, 2000);
}));
["touchend", "mouseup", "mouseleave", "touchcancel"].forEach(ev => pBtn.addEventListener(ev, () => {
  clearTimeout(pTimer); pBtn.textContent = "부모님";
}));

/* ---------- 외부 문항·대사 뱅크 ---------- */
fetch("problems.json").then(r => r.ok ? r.json() : null).then(d => {
  if (d && Array.isArray(d.storyTemplates)) {
    // v1 형식 {op,t} → {op,ko} 호환
    STORY_TPL = STORY_TPL.concat(d.storyTemplates.map(x => x.t ? { op: x.op, ko: x.t } : x).filter(x => x.ko || x.en));
  }
}).catch(() => {});
fetch("dialogue.json").then(r => r.ok ? r.json() : null).then(d => {
  if (!d) return;
  for (const [sp, kinds] of Object.entries(d)) {
    if (!PERSONA[sp]) continue;
    for (const [k, lines] of Object.entries(kinds)) {
      if (!Array.isArray(lines)) continue;
      PERSONA[sp][k] = (PERSONA[sp][k] || []).concat(lines.filter(l => typeof l === "string"));
    }
  }
}).catch(() => {});

/* ---------- init ---------- */
renderHome();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
